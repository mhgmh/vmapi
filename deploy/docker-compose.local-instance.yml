services:
  sub2api:
    container_name: sub2api-v2-local
    image: sub2api-v2-local:dev
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: dockerproxy.net/library/node:24-alpine
        GOLANG_IMAGE: dockerproxy.net/library/golang:1.26.5-alpine
        ALPINE_IMAGE: dockerproxy.net/library/alpine:3.21
        POSTGRES_IMAGE: dockerproxy.net/library/postgres:18-alpine

  postgres:
    container_name: sub2api-v2-local-postgres

  redis:
    container_name: sub2api-v2-local-redis
